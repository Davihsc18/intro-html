<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site sobre elemento Iframe. Inline Frame para embutir outros sites.">
    <title>Sobre Iframes</title>
</head>

<body>
    <h1>Iframe</h1>
    <hr>

    <h2>Para que serve?</h2>
    <p>O Inline Frame é um elemento que nos permite embutir outro documento ou conteúdo externos dentro da nossa página. É bastante usado para Youtube, Google, Maps, formularios externos e etc.</p>

    <h3>Exemplo basico de iframe</h3>
    <iframe src="04-imagens.html" frameborder="0"></iframe>

    <hr>
    <h3>carregando o Youtube</h3>

    <iframe 
        width="560" 
        height="315" 
        src="https://www.youtube.com/embed/qq76pQsI1iw?si=zz9fuHDARjEZPL3I" 
        title="YouTube video player COM O VÍDEO SOBRE GTA VI"
        frameborder="0" 
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen
    ></iframe>


    <h3>carregando Mapas</h3>
   <iframe 
   src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d7304.270531937766!2d-46.6619639!3d-23.742555349999993!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x94ce45e4e310ee1b%3A0x3947d1b2b990fdd4!2sCantinho%20do%20C%C3%A9u%2C%20S%C3%A3o%20Paulo%20-%20SP!5e0!3m2!1spt-PT!2sbr!4v1790166540193!5m2!1spt-PT!2sbr"
    width="600" 
    height="450" 
    style="border:0;" 
    allowfullscreen="" 
    loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>


    
<h2>PDF</h2>
<iframe src="A-Maquina-do-Tempo.pdf" frameborder="0"></iframe>
  
</body>

</html>
