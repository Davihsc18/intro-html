<!--DOCYTIPE - serve para indicar para os navegadores qual a versão e qual o padrão de HTML está sendo usado-->
<!DOCTYPE html>

<!-- HTML - elemento raiz, Tudo que pertencen ao documento HTML fica dentro dele  -->

<!-- LANG/language(idioma)= Atributo responsavel pela linguagem do conteúdo do site. Além disso, tem um impacto muito grande na acessivilidade e SEO. -->
<html lang="pt-br">


<head>

    <!-- charset - essa configuração serve para indicar ao navegador qual o padrão/codificação de caracteres especiais e emojis. -->
    <meta charset="UTF-8">

    <!-- Meta - É basicamente o tamanho da escala do dispositivo do cliente, e pode ser editada se for tablet, celular ou computador. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- title/título = Representa o título que aparece na aba do navegador para o usuario. -->
    <title>Olá mundo</title>

</head>


<!-- body - é o conteúdo visivel da pagina onde o usuario interage e consome recursos da pagina por exemplo titulos, paragrafos, imagens, videos, formularios e etc. -->
<body>
    Olá, Mundo. Este é Do meu primeiro progrma em HTML.
    
</body>

</html>
